name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
      - uses: actions/cache@v5
        with:
          path: .cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run check
      - if: runner.os == 'Linux'
        run: mise run test:race

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows-amd64, windows-arm64, linux-amd64, linux-arm64, macos-amd64, macos-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
      - uses: actions/cache@v5
        with:
          path: .cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: java-game-launcher-${{ matrix.target }}
          path: dist/java-game-launcher-${{ matrix.target }}*
          if-no-files-found: error
